<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>ToDo App</title>
</head>
<body>
    <h1>ToDoリスト</h1>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="タスクを入力" required>
        <button type="submit">追加</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li>
            {% if todo[2] == 1 %}
                <s>{{ todo[1] }}</s>
            {% else %}
                {{ todo[1] }}
            {% endif %}
            <a href="/toggle/{{ todo[0] }}">切替</a>
            <a href="/delete/{{ todo[0] }}">削除</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
